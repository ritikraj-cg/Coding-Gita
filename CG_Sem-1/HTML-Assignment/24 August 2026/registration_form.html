<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>
<body>
    
    <form>
   <label for="first name">First Name:</label>
   <input type="text" name="first name" placeholder="Enter First Name"><br><br>

   <label for="last name">Last Name:</label>
   <input type="text" name="last name" placeholder="Enter Last Name"><br><br>

   <label for="email">Email:</label>
   <input type="email" name="Email" placeholder="Enter Email Address"><br><br>

   <label for="password">Password:</label>
   <input type="password" name="password"><br><br>

   <label for="gender">Gender:</label><br><br>
   <input type="radio" name="gender" value="female">Female<br>
   <input type="radio" name="gender" value="other">Other<br>
   <input type="radio" name="gender" value="male">Male <br><br>
  
   <label for="age">Age:</label>
   <input type="number" name="age"><br><br>

   <label for="preferences">Preferences:</label><br>
   <label >Acrylic Painting<input type="checkbox" name="preferences"></label><br>
   <label >Oil Painting<input type="checkbox" name="preferences"></label><br>
   <label >Water Color Painting<input type="checkbox" name="preferences"></label><br><br>
<br>
   <label for="selection">Selection:</label>
   <select name="selection">
       <option value="option1">Student</option>
       <option value="option2">Teacher</option>
       <option value="option3">Principal</option>
   </select><br><br>

   <label>Bio<textarea name="share" minlength="500" maxlength="2000" rows="5" cols="15"></textarea></label>
<br><br>
<input type="reset">
<input type="submit">
</form>


</body>
</html>
